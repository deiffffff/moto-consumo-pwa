<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0f14"><title>Duelo de Reflejos</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:manipulation}button,a{font:inherit;color:inherit}.app{height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));gap:10px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.score{background:#121821;border:1px solid #29313d;border-radius:16px;padding:10px;font-weight:900}.score.r{text-align:right}.score b{font-size:24px}.status{font-size:11px;color:#9da8b6;text-align:center;font-weight:800}.arena{flex:1;min-height:0;display:flex;gap:10px;position:relative}.pad{flex:1;border:0;border-radius:26px;font-size:64px;font-weight:900}.p1{background:linear-gradient(165deg,#2f7cf1,#174795)}.p2{background:linear-gradient(165deg,#ef476f,#92223d)}.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(68%,310px);min-height:185px;border-radius:28px;background:rgba(7,10,14,.96);border:1px solid #323b48;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;pointer-events:none;box-shadow:0 20px 55px rgba(0,0,0,.55)}#ico{font-size:64px}#head{font-size:30px;font-weight:950;margin-top:7px}#sub{font-size:13px;color:#9da8b6;margin-top:7px}.bottom{display:grid;grid-template-columns:auto 1fr auto;gap:8px}.btn,.home{background:#121821;border:1px solid #29313d;border-radius:14px;padding:9px 12px;text-decoration:none;font-weight:900;text-align:center}.legend{text-align:center;color:#8793a2;font-size:10px;align-self:center}#overlay{position:fixed;inset:0;z-index:10;background:#080b10;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:100%;max-width:420px;background:#121821;border:1px solid #29313d;border-radius:26px;padding:22px}.modal h1{margin:0 0 8px;font-size:29px}.modal p{color:#b6c0cc;line-height:1.4}.rule{background:#0c1118;border:1px solid #252d38;border-radius:14px;padding:9px;margin:7px 0;font-size:13px}.start{width:100%;margin-top:10px;border:0;border-radius:16px;background:#47d783;color:#07110b;padding:14px;font-weight:950;font-size:17px}</style></head><body><div class="app"><div class="top"><div class="score">🔵 <b id="s1">0</b></div><div class="status" id="round">A 9</div><div class="score r"><b id="s2">0</b> 🔴</div></div><main class="arena"><button class="pad p1" id="p1">🔵</button><button class="pad p2" id="p2">🔴</button><div class="card"><div id="ico">⚡</div><div id="head">Duelo de Reflejos</div><div id="sub">Prepárate</div></div></main><div class="bottom"><a class="home" href="./">⌂</a><div class="legend">🔵 azul · 🔴 rojo · ⚡ cualquiera · 💣 nadie</div><button class="btn" id="restart">↻</button></div></div><div id="overlay"><div class="modal"><h1>⚡ Duelo de Reflejos</h1><p>El primero en llegar a <b>9</b> gana.</p><div class="rule">🔵 / 🔴: solo ese jugador toca.</div><div class="rule">⚡: cualquiera puede tocar.</div><div class="rule">💣: nadie toca; si picas, regalas un punto.</div><div class="rule">🤦 Pulsar antes de la señal resta 1.</div><button class="start" id="start">EMPEZAR</button></div></div><script>(function(){'use strict';var TARGET=9,s1=0,s2=0,r=0,active=false,phase='idle',type='',timer=null,lastTouch=0;var $=function(id){return document.getElementById(id)},E={s1:$('s1'),s2:$('s2'),r:$('round'),ico:$('ico'),h:$('head'),sub:$('sub'),ov:$('overlay'),start:$('start'),p1:$('p1'),p2:$('p2'),re:$('restart')};function show(i,h,s){E.ico.textContent=i;E.h.textContent=h;E.sub.textContent=s||''}function up(){E.s1.textContent=s1;E.s2.textContent=s2;E.r.textContent='RONDA '+r+' · A '+TARGET}function next(){if(!active)return;clearTimeout(timer);r++;phase='wait';up();show('👀','PREPARADOS','No toquéis todavía…');timer=setTimeout(function(){var x=Math.random();type=x<.30?'p1':x<.60?'p2':x<.82?'both':'bomb';phase='live';if(type==='p1')show('🔵','¡AZUL!','Solo azul');else if(type==='p2')show('🔴','¡ROJO!','Solo rojo');else if(type==='both')show('⚡','¡YA!','El primero puntúa');else show('💣','¡QUIETOS!','No toquéis');timer=setTimeout(timeout,type==='bomb'?1100:1300)},750+Math.random()*1650)}function falseStart(p){phase='result';if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);up();show('🤦','SALIDA FALSA',p===1?'Azul pierde 1':'Rojo pierde 1');timer=setTimeout(next,800)}function tap(p){if(!active)return;if(phase==='wait'){falseStart(p);return}if(phase!=='live')return;phase='result';clearTimeout(timer);var w=0,l=0,msg='';if(type==='both'){w=p;msg=p===1?'Azul fue más rápido':'Rojo fue más rápido'}else if(type==='bomb'){l=p;w=p===1?2:1;msg=p===1?'Azul cayó en la bomba':'Rojo cayó en la bomba'}else if(type==='p1'){if(p===1){w=1;msg='Azul, correcto'}else{w=1;l=2;msg='Rojo pulsó mal'}}else{if(p===2){w=2;msg='Rojo, correcto'}else{w=2;l=1;msg='Azul pulsó mal'}}if(w===1)s1++;if(w===2)s2++;if(l===1)s1=Math.max(0,s1-1);if(l===2)s2=Math.max(0,s2-1);up();show(l?'😈':'✅',l?'¡REGALO!':'PUNTO',msg);if(s1>=TARGET||s2>=TARGET)timer=setTimeout(end,650);else timer=setTimeout(next,760)}function timeout(){if(phase!=='live')return;phase='result';if(type==='bomb')show('😎','BIEN','Nadie cayó');else if(type==='p1'){s2++;up();show('⏱️','TARDE','Punto rojo')}else if(type==='p2'){s1++;up();show('⏱️','TARDE','Punto azul')}else show('🐢','TORTUGAS','Nadie llegó');if(s1>=TARGET||s2>=TARGET)timer=setTimeout(end,650);else timer=setTimeout(next,800)}function end(){active=false;E.r.textContent='FIN';show('🏆',s1>s2?'AZUL GANA':'ROJO GANA','🔵 '+s1+' — '+s2+' 🔴')}function start(){clearTimeout(timer);s1=s2=r=0;active=true;phase='wait';E.ov.style.display='none';up();next()}function bind(n,f){n.addEventListener('touchstart',function(e){lastTouch=Date.now();if(e.cancelable)e.preventDefault();f()},{passive:false});n.addEventListener('click',function(e){if(Date.now()-lastTouch<500)return;e.preventDefault();f()})}bind(E.start,start);bind(E.p1,function(){tap(1)});bind(E.p2,function(){tap(2)});bind(E.re,function(){active=false;clearTimeout(timer);E.ov.style.display='flex'})})();</script></body></html>
